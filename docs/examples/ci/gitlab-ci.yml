# Sample GitLab CI job: check the architecture model on every merge request and post what changed
# as a note. Add this job to your .gitlab-ci.yml.
#
# NOT RUN: this file was written without access to a GitLab instance; check it before relying on it.
# Posting the note uses GitLab's REST API (POST .../merge_requests/:iid/notes) and needs a project
# access token with the `api` scope in a masked CI/CD variable named GITLAB_TOKEN.
architecture:
  image: node:20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0 # dp diff reads the target branch's model from git history
  script:
    # Pin a release tag or commit instead of the default branch for repeatable runs.
    - npm install -g github:AbhishekR3/designPerspectives
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - dp check
    - dp diff --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --out dp-diff.md
    - >
      curl -fsS --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN"
      --data-urlencode "body@dp-diff.md"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
  artifacts:
    paths:
      - dp-diff.md
