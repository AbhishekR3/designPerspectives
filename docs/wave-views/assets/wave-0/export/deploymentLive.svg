  <g class="nodes">
    <g class="node" data-id="live.aws.cdn.staticContent"><rect class="shape data-store" x="120" y="630" width="320" height="180" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><ellipse class="shape data-store-top" cx="280" cy="630" rx="160" ry="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="280" y="703" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Static Content</text><text x="280" y="718" font-size="11" text-anchor="middle" fill="#222222">[Data store: Directory of static HTML, CSS and JavaScript files]</text><text x="280" y="733" font-size="12" text-anchor="middle" fill="#222222">Holds the built files that make up the</text><text x="280" y="748" font-size="12" text-anchor="middle" fill="#222222">single-page application.</text></g>
    <g class="node" data-id="live.aws.containerService.api"><rect class="shape card" x="570" y="630" width="320" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="730" y="703" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">API Application</text><text x="730" y="718" font-size="11" text-anchor="middle" fill="#222222">[Container: Java and Spring Boot]</text><text x="730" y="733" font-size="12" text-anchor="middle" fill="#222222">Server-side banking logic offered to the front</text><text x="730" y="748" font-size="12" text-anchor="middle" fill="#222222">end as a JSON API.</text></g>
    <g class="node" data-id="live.aws.email.ses"><rect class="shape card" x="110" y="1033" width="320" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="270" y="1106" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Amazon Simple Email Service</text><text x="270" y="1121" font-size="11" text-anchor="middle" fill="#222222">[Software system]</text><text x="270" y="1136" font-size="12" text-anchor="middle" fill="#222222">Cloud e-mail delivery service the bank already</text><text x="270" y="1151" font-size="12" text-anchor="middle" fill="#222222">relies on.</text></g>
    <g class="node" data-id="live.aws.managedMysql.db"><rect class="shape data-store" x="560" y="1033" width="340" height="180" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><ellipse class="shape data-store-top" cx="730" cy="1033" rx="170" ry="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="730" y="1106" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Database</text><text x="730" y="1121" font-size="11" text-anchor="middle" fill="#222222">[Data store: MySQL database schema]</text><text x="730" y="1136" font-size="12" text-anchor="middle" fill="#222222">Keeps customer login credentials and related</text><text x="730" y="1151" font-size="12" text-anchor="middle" fill="#222222">security data.</text></g>
    <g class="node" data-id="live.aws.objectStorage.statementStore"><rect class="shape data-store" x="1030" y="1033" width="334" height="180" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><ellipse class="shape data-store-top" cx="1197" cy="1033" rx="167" ry="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="1197" y="1106" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Statement Store</text><text x="1197" y="1121" font-size="11" text-anchor="middle" fill="#222222">[Data store: Amazon S3 bucket]</text><text x="1197" y="1136" font-size="12" text-anchor="middle" fill="#222222">Cache of previously generated PDF account</text><text x="1197" y="1151" font-size="12" text-anchor="middle" fill="#222222">statements.</text></g>
    <g class="node" data-id="live.customerDevice.browser.spa"><rect class="shape card" x="359" y="202" width="321" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="520" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Single-Page Application</text><text x="520" y="290" font-size="11" text-anchor="middle" fill="#222222">[Container: JavaScript and Angular]</text><text x="520" y="305" font-size="12" text-anchor="middle" fill="#222222">Browser-based user interface for all online</text><text x="520" y="320" font-size="12" text-anchor="middle" fill="#222222">banking features.</text></g>
    <g class="node" data-id="live.dataCentre.corebankingServers.corebanking"><rect class="shape card" x="1518" y="1033" width="355" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="1696" y="1106" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Core Banking System</text><text x="1696" y="1121" font-size="11" text-anchor="middle" fill="#222222">[Software system]</text><text x="1696" y="1136" font-size="12" text-anchor="middle" fill="#222222">Packaged system of record for customer accounts and</text><text x="1696" y="1151" font-size="12" text-anchor="middle" fill="#222222">transactions, exposed through an API.</text></g>
