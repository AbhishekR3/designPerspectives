  <g class="nodes">
    <g class="node" data-id="corebanking"><rect class="shape card" x="2633" y="1470" width="355" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="2811" y="1543" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Core Banking System</text><text x="2811" y="1558" font-size="11" text-anchor="middle" fill="#222222">[Software system]</text><text x="2811" y="1573" font-size="12" text-anchor="middle" fill="#222222">Packaged system of record for customer accounts and</text><text x="2811" y="1588" font-size="12" text-anchor="middle" fill="#222222">transactions, exposed through an API.</text></g>
    <g class="node" data-id="ibs.api.accountsSummaryApi"><rect class="shape card" x="887" y="440" width="320" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="1047" y="513" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Accounts Summary API</text><text x="1047" y="528" font-size="11" text-anchor="middle" fill="#222222">[Component: Spring Web MVC]</text><text x="1047" y="543" font-size="12" text-anchor="middle" fill="#222222">Endpoint returning an overview of a customer's</text><text x="1047" y="558" font-size="12" text-anchor="middle" fill="#222222">accounts.</text></g>
    <g class="node" data-id="ibs.api.coreBankingAdapter"><rect class="shape card" x="1748" y="1127" width="320" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="1908" y="1200" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Core Banking System Adapter</text><text x="1908" y="1215" font-size="11" text-anchor="middle" fill="#222222">[Component: Spring Bean]</text><text x="1908" y="1230" font-size="12" text-anchor="middle" fill="#222222">Translates internal requests into calls on the</text><text x="1908" y="1245" font-size="12" text-anchor="middle" fill="#222222">core banking API.</text></g>
    <g class="node" data-id="ibs.api.email"><rect class="shape card" x="469" y="1470" width="345" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="642" y="1543" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Email Component</text><text x="642" y="1558" font-size="11" text-anchor="middle" fill="#222222">[Component: Spring Bean]</text><text x="642" y="1573" font-size="12" text-anchor="middle" fill="#222222">Composes and dispatches notification e-mails to</text><text x="642" y="1588" font-size="12" text-anchor="middle" fill="#222222">customers.</text></g>
    <g class="node" data-id="ibs.api.security"><rect class="shape card" x="482" y="1127" width="320" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="642" y="1200" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Security Component</text><text x="642" y="1215" font-size="11" text-anchor="middle" fill="#222222">[Component: Spring Bean]</text><text x="642" y="1230" font-size="12" text-anchor="middle" fill="#222222">Checks credentials, issues tokens and</text><text x="642" y="1245" font-size="12" text-anchor="middle" fill="#222222">validates them on later requests.</text></g>
    <g class="node" data-id="ibs.api.signInApi"><rect class="shape card" x="68" y="440" width="332" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="234" y="513" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Sign In API</text><text x="234" y="528" font-size="11" text-anchor="middle" fill="#222222">[Component: Spring Web MVC]</text><text x="234" y="543" font-size="12" text-anchor="middle" fill="#222222">Endpoint where customers authenticate and obtain</text><text x="234" y="558" font-size="12" text-anchor="middle" fill="#222222">an access token.</text></g>
    <g class="node" data-id="ibs.api.statementApi"><rect class="shape card" x="1317" y="440" width="351" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="1493" y="513" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Statement API</text><text x="1493" y="528" font-size="11" text-anchor="middle" fill="#222222">[Component: Spring Web MVC]</text><text x="1493" y="543" font-size="12" text-anchor="middle" fill="#222222">Endpoint returning account statements as PDF</text><text x="1493" y="558" font-size="12" text-anchor="middle" fill="#222222">documents.</text></g>
    <g class="node" data-id="ibs.api.statements"><rect class="shape card" x="1765" y="784" width="338" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="1934" y="857" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Statement Component</text><text x="1934" y="872" font-size="11" text-anchor="middle" fill="#222222">[Component: Spring Bean]</text><text x="1934" y="887" font-size="12" text-anchor="middle" fill="#222222">Produces statements, reusing cached copies where</text><text x="1934" y="902" font-size="12" text-anchor="middle" fill="#222222">they already exist.</text></g>
    <g class="node" data-id="ibs.db"><rect class="shape data-store" x="2183" y="1470" width="340" height="180" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><ellipse class="shape data-store-top" cx="2353" cy="1470" rx="170" ry="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="2353" y="1543" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Database</text><text x="2353" y="1558" font-size="11" text-anchor="middle" fill="#222222">[Data store: MySQL database schema]</text><text x="2353" y="1573" font-size="12" text-anchor="middle" fill="#222222">Keeps customer login credentials and related</text><text x="2353" y="1588" font-size="12" text-anchor="middle" fill="#222222">security data.</text></g>
    <g class="node" data-id="ibs.spa"><rect class="shape card" x="886" y="88" width="321" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="1047" y="161" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Single-Page Application</text><text x="1047" y="176" font-size="11" text-anchor="middle" fill="#222222">[Container: JavaScript and Angular]</text><text x="1047" y="191" font-size="12" text-anchor="middle" fill="#222222">Browser-based user interface for all online</text><text x="1047" y="206" font-size="12" text-anchor="middle" fill="#222222">banking features.</text></g>
    <g class="node" data-id="ibs.statementStore"><rect class="shape data-store" x="2183" y="1127" width="334" height="180" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><ellipse class="shape data-store-top" cx="2350" cy="1127" rx="167" ry="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="2350" y="1200" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Statement Store</text><text x="2350" y="1215" font-size="11" text-anchor="middle" fill="#222222">[Data store: Amazon S3 bucket]</text><text x="2350" y="1230" font-size="12" text-anchor="middle" fill="#222222">Cache of previously generated PDF account</text><text x="2350" y="1245" font-size="12" text-anchor="middle" fill="#222222">statements.</text></g>
    <g class="node" data-id="ses"><rect class="shape card" x="482" y="1813" width="320" height="180" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="1"/><text x="642" y="1886" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Amazon Simple Email Service</text><text x="642" y="1901" font-size="11" text-anchor="middle" fill="#222222">[Software system]</text><text x="642" y="1916" font-size="12" text-anchor="middle" fill="#222222">Cloud e-mail delivery service the bank already</text><text x="642" y="1931" font-size="12" text-anchor="middle" fill="#222222">relies on.</text></g>
