name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install (builds dist/)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run format:check
      - name: Unit and API tests
        run: npm test
      - name: Test list (tests/TESTS.csv) is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run test:list -- --check
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Built UI is committed
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: git diff --exit-code --stat static/ && test -z "$(git status --porcelain static/)"
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Demo model is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          npm run make-demo
          git diff --exit-code demo/
      - name: Demo model, its sample draft and its code mapping check clean
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          npm run dp -- init --demo "$RUNNER_TEMP/demo-check"
          npm run dp -- check --strict "$RUNNER_TEMP/demo-check"
      - name: Package installs and runs
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          npm pack
          npm install -g ./designperspectives-*.tgz
          dp --version
          mkdir /tmp/dp-smoke && dp init /tmp/dp-smoke && dp validate /tmp/dp-smoke
