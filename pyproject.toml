[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "designperspectives"
version = "0.1.0"
description = "Open-source, model-based C4 architecture tool with lenses for different audiences."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Abhishek Ramesh" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "pytest-playwright>=0.5",
]

[project.scripts]
dp = "designperspectives.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/designperspectives"]

[tool.hatch.build.targets.sdist]
include = ["src/designperspectives", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
